<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="40%" stop-color="#0c1322" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>

    <!-- Glowing Orbs Gradients -->
    <radialGradient id="orbCyan" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbPurple" cx="85%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#9d4edd" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbOrange" cx="50%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#ff9e00" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ff9e00" stop-opacity="0" />
    </radialGradient>

    <!-- Title Linear Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Tagline Gradient -->
    <linearGradient id="taglineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Card/Badge Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.6" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="40" cy="0" r="1.2" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="380" rx="20" fill="url(#bgGrad)" />
  <rect width="1200" height="380" rx="20" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <rect width="1200" height="380" rx="20" fill="url(#orbCyan)" />
  <rect width="1200" height="380" rx="20" fill="url(#orbPurple)" />
  <rect width="1200" height="380" rx="20" fill="url(#orbOrange)" />

  <!-- Subtle Outline Border -->
  <rect x="1.5" y="1.5" width="1197" height="377" rx="19" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Live Status Badge (Top Center) -->
  <g transform="translate(600, 52)">
    <!-- Pill background -->
    <rect x="-185" y="-18" width="370" height="36" rx="18" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
    <!-- Glowing green dot -->
    <circle cx="-150" cy="0" r="5" fill="#22c55e" filter="url(#softGlow)" />
    <circle cx="-150" cy="0" r="2.5" fill="#ffffff" />
    <text x="-130" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1.2">DAILY DROPS ACTIVE</text>
    <text x="25" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">| 15 TECH CATEGORIES</text>
  </g>

  <!-- Decorative Corner Code Brackets -->
  <g fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <path d="M 60 70 L 40 70 L 40 100" />
    <path d="M 1140 70 L 1160 70 L 1160 100" />
    <path d="M 40 280 L 40 310 L 60 310" />
    <path d="M 1160 280 L 1160 310 L 1140 310" />
  </g>

  <!-- Main Title -->
  <g transform="translate(600, 155)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Montserrat, Arial, sans-serif" font-size="64" font-weight="900" fill="url(#titleGrad)" letter-spacing="3" filter="url(#glow)">
      SMALL PROJECTS
    </text>
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Montserrat, Arial, sans-serif" font-size="64" font-weight="900" fill="url(#titleGrad)" letter-spacing="3">
      SMALL PROJECTS
    </text>
  </g>

  <!-- Subtitle / Tagline -->
  <g transform="translate(600, 215)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="18" font-weight="400" fill="url(#taglineGrad)" letter-spacing="0.5">
      The 15-Domain Multiverse: Web, Mobile, AI, Big Data, Security, Cloud, DevOps, Systems &amp; Beyond
    </text>
    <text x="0" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#38bdf8" letter-spacing="0.5">
      🚀 Fresh project added every single day • Continuous Learning • Production-Grade Craft
    </text>
  </g>

  <!-- Category Badges Carousel / Pills (Bottom Row) -->
  <g transform="translate(50, 305)">
    <!-- Pill 1: Web -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="130" height="36" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" />
      <text x="65" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🌐 Web Dev</text>
    </g>

    <!-- Pill 2: Mobile -->
    <g transform="translate(140, 0)">
      <rect x="0" y="0" width="130" height="36" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#22c55e" stroke-width="1.2" stroke-opacity="0.8" />
      <text x="65" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">📱 Mobile</text>
    </g>

    <!-- Pill 3: AI & ML -->
    <g transform="translate(280, 0)">
      <rect x="0" y="0" width="130" height="36" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.8" />
      <text x="65" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🧠 AI &amp; ML</text>
    </g>

    <!-- Pill 4: Data & Cloud -->
    <g transform="translate(420, 0)">
      <rect x="0" y="0" width="130" height="36" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.8" />
      <text x="65" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">☁️ Cloud &amp; SRE</text>
    </g>

    <!-- Pill 5: Cyber -->
    <g transform="translate(560, 0)">
      <rect x="0" y="0" width="130" height="36" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#ef4444" stroke-width="1.2" stroke-opacity="0.8" />
      <text x="65" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🛡️ Security</text>
    </g>

    <!-- Pill 6: Systems & Game -->
    <g transform="translate(700, 0)">
      <rect x="0" y="0" width="130" height="36" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.8" />
      <text x="65" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">⚡ Systems</text>
    </g>

    <!-- Pill 7: IoT & Web3 -->
    <g transform="translate(840, 0)">
      <rect x="0" y="0" width="130" height="36" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#eab308" stroke-width="1.2" stroke-opacity="0.8" />
      <text x="65" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🌐 Web3 &amp; IoT</text>
    </g>

    <!-- Pill 8: 15 Disciplines -->
    <g transform="translate(980, 0)">
      <rect x="0" y="0" width="120" height="36" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#f97316" stroke-width="1.2" stroke-opacity="0.8" />
      <text x="60" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f97316">✨ 15 Tracks</text>
    </g>
  </g>
</svg>
